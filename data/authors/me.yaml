bio: |
  Oleksandr P. Romanchuk is a Doctor of Medical Sciences and Professor working at the
  intersection of sports medicine, cardiovascular autonomic physiology and physical
  rehabilitation. His research applies spiroarteriocardiorhythmography (SACR) to the
  simultaneous assessment of cardiac, vascular and respiratory regulation in elite
  athletes, in patients with arterial hypertension and cardiovascular disease, and
  in people undergoing rehabilitation after injury.

